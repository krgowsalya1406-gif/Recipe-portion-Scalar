<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipe Portion Scaler</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    padding: 25px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 55px;
}

.header h1 {
    margin: 10px 0;
    color: #222;
}

.header p {
    color: #777;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
}

.control-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #ff5e62;
}

.search-box {
    margin-bottom: 25px;
}

.recipe-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.recipe-card {
    background: #fafafa;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    border: 2px solid transparent;
}

.recipe-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

.recipe-card.active {
    border-color: #ff5e62;
}

.recipe-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.recipe-info {
    padding: 12px;
}

.recipe-info h3 {
    font-size: 16px;
    margin-bottom: 6px;
}

.recipe-info p {
    color: #777;
    font-size: 13px;
}

.details {
    display: none;
    margin-top: 30px;
}

.hero {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 25px;
    align-items: center;
}

.hero img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 18px;
}

.hero-content h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.description {
    color: #666;
    line-height: 1.6;
    margin-bottom: 15px;
}

.meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.badge {
    padding: 8px 12px;
    background: #fff0eb;
    color: #e64a45;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.favorite {
    background: #ffe5e5;
    color: #e74c3c;
}

.copy {
    background: #222;
    color: white;
}

.shopping {
    background: #ff9966;
    color: white;
}

.content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 25px;
}

.section {
    background: #f8f8f8;
    padding: 20px;
    border-radius: 15px;
}

.section h3 {
    margin-bottom: 15px;
}

.ingredients {
    list-style: none;
}

.ingredients li {
    display: flex;
    justify-content: space-between;
    padding: 11px;
    background: white;
    margin-bottom: 8px;
    border-radius: 8px;
}

.amount {
    font-weight: bold;
    color: #ff5e62;
}

.instructions {
    padding-left: 20px;
}

.instructions li {
    margin-bottom: 12px;
    color: #555;
    line-height: 1.5;
}

.shopping-list {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #eefaf3;
    border-radius: 15px;
}

.shopping-list h3 {
    margin-bottom: 12px;
}

.shopping-list ul {
    padding-left: 20px;
}

.shopping-list li {
    margin: 7px 0;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
    display: none;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #aaa;
    font-size: 12px;
}

@media(max-width: 900px) {
    .recipe-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 700px) {
    .controls,
    .content-grid,
    .hero {
        grid-template-columns: 1fr;
    }

    .recipe-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 450px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 18px;
    }

    .recipe-grid {
        grid-template-columns: 1fr;
    }

    .hero-content h2 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🍳</div>
        <h1>Recipe Portion Scaler</h1>
        <p>Choose a recipe and automatically adjust ingredients for any number of people.</p>
    </div>

    <div class="controls">

        <div class="control-box">
            <label>👨 Original Servings</label>
            <input type="number" id="original" value="2" min="1">
        </div>

        <div class="control-box">
            <label>👨‍👩‍👧 Desired Servings</label>
            <input type="number" id="desired" value="4" min="1">
        </div>

        <div class="control-box">
            <label>📂 Category</label>
            <select id="category" onchange="filterRecipes()">
                <option value="all">All Foods</option>
                <option value="indian">Indian</option>
                <option value="breakfast">Breakfast</option>
                <option value="snacks">Snacks</option>
                <option value="dessert">Desserts</option>
            </select>
        </div>

    </div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 Search for a recipe..."
            oninput="filterRecipes()"
        >
    </div>

    <div class="recipe-grid" id="recipeGrid"></div>

    <div class="empty" id="empty">
        😕 No recipes found.
    </div>

    <div class="details" id="details"></div>

    

</div>

let selectedRecipe = null;
let favoriteRecipes =
    JSON.parse(localStorage.getItem("favoriteRecipes")) || [];


/* =========================
   DISPLAY RECIPES
========================= */

function displayRecipes(list) {

    const grid =
        document.getElementById("recipeGrid");

    const empty =
        document.getElementById("empty");

    grid.innerHTML = "";

    if (list.length === 0) {

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    list.forEach(recipe => {

        const card =
            document.createElement("div");

        card.className = "recipe-card";

        if (selectedRecipe &&
            selectedRecipe.id === recipe.id) {

            card.classList.add("active");

        }


        card.innerHTML = `

            <img
                src="${recipe.image}"
                alt="${recipe.name}"
            >

            <div class="recipe-info">

                <h3>
                    ${recipe.emoji} ${recipe.name}
                </h3>

                <p>
                    ⏱️ ${recipe.time}
                    • ${recipe.difficulty}
                </p>

            </div>

        `;


        card.onclick = function() {

            selectRecipe(recipe);

        };


        grid.appendChild(card);

    });

}


/* =========================
   FILTER
========================= */

function filterRecipes() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const category =
        document.getElementById("category")
        .value;


    const filtered =
        recipes.filter(recipe => {

            const matchesSearch =
                recipe.name
                .toLowerCase()
                .includes(search);

            const matchesCategory =
                category === "all" ||
                recipe.category === category;

            return matchesSearch &&
                   matchesCategory;

        });


    displayRecipes(filtered);

}


/* =========================
   SELECT RECIPE
========================= */

function selectRecipe(recipe) {

    selectedRecipe = recipe;

    displayRecipes(
        recipes.filter(r =>
            document.getElementById("category").value === "all"
            ? true
            : r.category === document.getElementById("category").value
        )
    );

    showDetails();

}


/* =========================
   SHOW DETAILS
========================= */

function showDetails() {

    const recipe =
        selectedRecipe;

    const original =
        Number(document.getElementById("original").value);

    const desired =
        Number(document.getElementById("desired").value);


    if (
        original <= 0 ||
        desired <= 0
    ) {

        alert("Please enter valid serving numbers.");

        return;

    }


    const multiplier =
        desired / original;


    const scaledIngredients =
        recipe.ingredients.map(item => {

            return {

                name: item[0],

                amount: item[1] * multiplier,

                unit: item[2]

            };

        });


    let ingredientsHTML = "";


    scaledIngredients.forEach(item => {

        ingredientsHTML += `

            <li>

                <span>
                    ${item.name}
                </span>

                <span class="amount">
                    ${formatAmount(item.amount)}
                    ${item.unit}
                </span>

            </li>

        `;

    });


    let instructionsHTML = "";


    recipe.instructions.forEach(step => {

        instructionsHTML += `
            <li>${step}</li>
        `;

    });


    const isFavorite =
        favoriteRecipes.includes(recipe.id);


    const details =
        document.getElementById("details");


    details.innerHTML = `

        <div class="hero">

            <img
                src="${recipe.image}"
                alt="${recipe.name}"
            >

            <div class="hero-content">

                <h2>
                    ${recipe.emoji} ${recipe.name}
                </h2>

                <p class="description">
                    ${recipe.description}
                </p>

                <div class="meta">

                    <span class="badge">
                        ⏱️ ${recipe.time}
                    </span>

                    <span class="badge">
                        ⭐ ${recipe.difficulty}
                    </span>

                    <span class="badge">
                        👨‍👩‍👧 ${desired} servings
                    </span>

                </div>

                <div class="actions">

                    <button
                        class="favorite"
                        onclick="toggleFavorite()"
                    >
                        ${isFavorite ? "❤️ Favorited" : "🤍 Favorite"}
                    </button>

                    <button
                        class="copy"
                        onclick="copyIngredients()"
                    >
                        📋 Copy Ingredients
                    </button>

                    <button
                        class="shopping"
                        onclick="createShoppingList()"
                    >
                        🛒 Shopping List
                    </button>

                </div>

            </div>

        </div>


        <div class="content-grid">

            <div class="section">

                <h3>
                    🥕 Ingredients for ${desired} people
                </h3>

                <ul class="ingredients">
                    ${ingredientsHTML}
                </ul>

            </div>


            <div class="section">

                <h3>
                    👨‍🍳 Instructions
                </h3>

                <ol class="instructions">
                    ${instructionsHTML}
                </ol>

            </div>

        </div>


        <div
            class="shopping-list"
            id="shoppingList"
        >

            <h3>
                🛒 Shopping List
            </h3>

            <ul id="shoppingItems"></ul>

        </div>

    `;


    details.style.display = "block";

    details.scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   FORMAT AMOUNT
========================= */

function formatAmount(value) {

    if (Number.isInteger(value)) {

        return value;

    }

    return Number(
        value.toFixed(2)
    );

}


/* =========================
   UPDATE SERVINGS
========================= */

document.getElementById("original")
.addEventListener("input", function() {

    if (selectedRecipe) {

        showDetails();

    }

});


document.getElementById("desired")
.addEventListener("input", function() {

    if (selectedRecipe) {

        showDetails();

    }

});


/* =========================
   FAVORITE
========================= */

function toggleFavorite() {

    if (!selectedRecipe) return;


    const index =
        favoriteRecipes.indexOf(
            selectedRecipe.id
        );


    if (index === -1) {

        favoriteRecipes.push(
            selectedRecipe.id
        );

    } else {

        favoriteRecipes.splice(
            index,
            1
        );

    }


    localStorage.setItem(
        "favoriteRecipes",
        JSON.stringify(favoriteRecipes)
    );


    showDetails();

}


/* =========================
   COPY INGREDIENTS
========================= */

function copyIngredients() {

    const original =
        Number(document.getElementById("original").value);

    const desired =
        Number(document.getElementById("desired").value);


    const multiplier =
        desired / original;


    let text =
        `${selectedRecipe.name}\n`;

    text +=
        `Ingredients for ${desired} servings:\n\n`;


    selectedRecipe.ingredients.forEach(item => {

        text +=
            `${item[0]} - `
            + `${formatAmount(item[1] * multiplier)} `
            + `${item[2]}\n`;

    });


    navigator.clipboard.writeText(text);

    alert(
        "✅ Ingredients copied!"
    );

}


/* =========================
   SHOPPING LIST
========================= */

function createShoppingList() {

    const original =
        Number(document.getElementById("original").value);

    const desired =
        Number(document.getElementById("desired").value);


    const multiplier =
        desired / original;


    const list =
        document.getElementById("shoppingItems");


    list.innerHTML = "";


    selectedRecipe.ingredients
    .forEach(item => {

        const li =
            document.createElement("li");

        li.textContent =
            `${item[0]} — `
            + `${formatAmount(item[1] * multiplier)} `
            + `${item[2]}`;

        list.appendChild(li);

    });


    document.getElementById(
        "shoppingList"
    ).style.display = "block";

}


/* Initial display */

displayRecipes(recipes);

</script>

</body>
</html>
